name: voiceqwen
on:
  workflow_dispatch:
    inputs:
      script: {default: "voices/kuskoy/qwen.py"}
      out: {default: "voices/kuskoy/voice3"}
      only: {default: "999"}
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -U qwen-tts soundfile
      - run: sudo apt-get install -y sox libsox-fmt-all >/dev/null || true
      - run: mkdir -p ${{ inputs.out }} && python ${{ inputs.script }} ${{ inputs.only }}
      - if: always()
        run: |
          git config user.name tts-bot; git config user.email tts@bot
          mkdir /tmp/v && cp -r ${{ inputs.out }} /tmp/v/
          git checkout --orphan vq && git rm -rq --cached . && git clean -fdq
          mkdir -p ${{ inputs.out }} && cp -r /tmp/v/*/* ${{ inputs.out }}/
          git add ${{ inputs.out }} && git commit -qm voice && git push -f origin vq:voicesq
