name: acctest
on:
  workflow_dispatch:
    inputs:
      ep: {description: "episode dir under voices/ with acctest.json"}
jobs:
  acc:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -U qwen-tts soundfile edge-tts && pip install --force-reinstall --no-deps torch torchaudio --index-url https://download.pytorch.org/whl/cpu
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg sox libsox-fmt-all >/dev/null
      - run: mkdir -p voices/${{ inputs.ep }}/acc && python tools/voice/acctest.py ${{ inputs.ep }}
      - run: |
          git config user.name tts-bot; git config user.email tts@bot
          mkdir /tmp/a && cp -r voices/${{ inputs.ep }}/acc /tmp/a/
          git checkout --orphan acc && git rm -rqf --cached . && git clean -fdqx
          mkdir -p voices/${{ inputs.ep }} && cp -r /tmp/a/acc voices/${{ inputs.ep }}/
          git add -f voices/${{ inputs.ep }}/acc && git commit -qm acc && git push -f origin acc:acc-${{ inputs.ep }}
