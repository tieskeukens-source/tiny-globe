name: voicejoin
on:
  workflow_dispatch:
    inputs:
      run_id: {description: "voicecast run id"}
jobs:
  join:
    runs-on: ubuntu-latest
    permissions: {contents: write, actions: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/download-artifact@v4
        with: {path: voices/kuskoy/voice4, merge-multiple: true, run-id: "${{ inputs.run_id }}", github-token: "${{ github.token }}"}
      - run: pip install faster-whisper soundfile numpy && python voices/kuskoy/qtime.py
      - run: |
          git config user.name tts-bot; git config user.email tts@bot
          mkdir /tmp/v && cp -r voices/kuskoy/voice4 /tmp/v/
          git checkout --orphan vq && git rm -rq --cached . && git clean -fdq
          mkdir -p voices/kuskoy/voice4 && cp -r /tmp/v/voice4/* voices/kuskoy/voice4/
          git add voices/kuskoy/voice4 && git commit -qm voice && git push -f origin vq:voices4
